<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            if (window.location.protocol === 'http:') {
                window.location.replace(
                    'https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash
                );
            }
        })();
    </script>
    <title>제품 상세 - 제이원로보틱스</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .detail-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            padding: 7rem 0 3rem;
            margin-top: 80px;
            color: #fff;
        }

        .detail-hero .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #93c5fd;
            padding: 0.35rem 0.85rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .detail-hero h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .detail-hero p {
            color: rgba(255, 255, 255, 0.85);
            max-width: 720px;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .detail-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }

        .detail-categories span {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        .detail-body {
            padding: 3rem 0 4rem;
            background: #f8fafc;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .detail-image {
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .detail-image img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            display: block;
        }

        .detail-image-hint {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.75rem 1rem;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.92));
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .detail-panel {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2rem;
        }

        .detail-panel h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .detail-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-features span {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .detail-quote {
            background: #f8fafc;
            border-left: 3px solid #3b82f6;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            color: #334155;
            font-size: 0.95rem;
        }

        .detail-quote strong {
            color: #0f172a;
        }

        .spec-grid {
            display: grid;
            gap: 0.75rem;
        }

        .spec-item {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }

        .spec-item dt {
            font-weight: 600;
            color: #64748b;
        }

        .spec-item dd {
            color: #1e293b;
            margin: 0;
        }

        .detail-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .detail-actions a {
            flex: 1;
            min-width: 140px;
            text-align: center;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-quote {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
        }

        .btn-quote:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        .btn-back {
            background: #fff;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-back:hover {
            background: #f8fafc;
        }

        .detail-not-found {
            text-align: center;
            padding: 4rem 2rem;
        }

        @media (max-width: 900px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header" role="banner">
        <div class="header-content">
            <a href="../index.html" class="logo" aria-label="제이원로보틱스 홈으로 이동">
                <div class="logo-text">
                    <span class="logo-ko">(주)제이원 로보틱스</span>
                    <span class="logo-en">J-WON Robotics Co., Ltd.</span>
                </div>
            </a>
            <nav class="nav" role="navigation">
                <ul class="nav-list">
                    <li><a href="../index.html">홈</a></li>
                    <li><a href="index.html" class="active">제품소개</a></li>
                    <li><a href="../media/index.html">홍보센터</a></li>
                    <li><a href="../about/index.html">회사소개</a></li>
                    <li><a href="../contact/index.html">문의</a></li>
                </ul>
            </nav>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="메뉴 열기">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
            <li><a href="../index.html">홈</a></li>
            <li><a href="index.html">제품소개</a></li>
            <li id="breadcrumbProduct">제품 상세</li>
        </ol>
    </nav>

    <div id="detailContent"></div>
    <div id="detailNotFound" class="detail-not-found" style="display:none;">
        <h2>제품을 찾을 수 없습니다</h2>
        <p style="color:#64748b; margin: 1rem 0 2rem;">요청하신 제품군 정보가 없습니다.</p>
        <a href="index.html" class="btn-back" style="display:inline-block; padding:0.75rem 1.5rem; border-radius:8px; text-decoration:none;">제품 목록으로</a>
    </div>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 제이원로보틱스. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="../product-manager.js"></script>
    <script>
        function renderDetail() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('p');
            const product = window.productManager.findProductBySlug(slug);

            if (!product) {
                document.getElementById('detailNotFound').style.display = 'block';
                return;
            }

            document.title = `${product.name} - 제이원로보틱스`;
            document.getElementById('breadcrumbProduct').textContent = product.name;

            const placeholder = window.productManager.placeholderPath();
            const categories = product.categories || [product.category];
            const specs = product.specifications || {};

            document.getElementById('detailContent').innerHTML = `
                <section class="detail-hero">
                    <div class="container">
                        <span class="badge">${product.badge || ''}</span>
                        <h1>${product.name}</h1>
                        <p>${product.description}</p>
                        <div class="detail-categories">
                            ${categories.map((c) => `<span>${c}</span>`).join('')}
                        </div>
                    </div>
                </section>
                <section class="detail-body">
                    <div class="container">
                        <div class="detail-grid">
                            <div class="detail-image">
                                <img src="${product.thumbnail}" alt="${product.name}"
                                     onerror="this.onerror=null;this.src='${placeholder}'">
                                ${product.imageHint ? `<div class="detail-image-hint">${product.imageHint}</div>` : ''}
                            </div>
                            <div class="detail-panel">
                                <h2>제품 개요</h2>
                                <div class="detail-features">
                                    ${(product.features || []).map((f) => `<span>${f}</span>`).join('')}
                                </div>
                                <div class="detail-quote">
                                    <strong>견적:</strong> ${product.price || '현장 조건별 별도 산정'}
                                </div>
                                <h2>주요 사양</h2>
                                <dl class="spec-grid">
                                    ${Object.entries(specs).map(([key, value]) => `
                                        <div class="spec-item">
                                            <dt>${key}</dt>
                                            <dd>${value}</dd>
                                        </div>
                                    `).join('')}
                                </dl>
                                <div class="detail-actions">
                                    <a href="${window.productManager.getQuoteUrl(product)}" class="btn-quote">견적문의</a>
                                    <a href="index.html" class="btn-back">제품 목록</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        document.addEventListener('DOMContentLoaded', renderDetail);
    </script>
</body>
</html>
